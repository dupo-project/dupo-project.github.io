name: ci

on:
  push:
  pull_request:

jobs:
  cpu-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install data-check dependencies
        run: python -m pip install pandas pyarrow
      - name: Repository hygiene and shell syntax
        run: make check
      - name: Reward smoke test
        run: make smoke
      - name: Data preparation smoke test
        run: make prepare-mini
